inherit_gem:
  rubocop-govuk:
    - config/default.yml
    - config/rails.yml
    - config/rspec.yml

require:
  - ./.rubocop/cop/trade_tariff/config_order

plugins:
  - rubocop-rspec
  - rubocop-capybara

AllCops:
  Exclude:
    - "db/schema.rb"
    - "vendor/**/*"
    - "bin/**"
    - "db/**/*"
    - "node_modules/**/*"
    - "tmp/**/*"

Layout/LineLength:
  Max: 120

Metrics/AbcSize:
  Max: 20

# Preserve our stricter RSpec checks when inheriting GOV.UK defaults.
RSpec/ContextWording:
  Prefixes:
    - when
    - with
    - without

RSpec/DescribeClass:
  Enabled: true
  Exclude:
    - tasks/**/*.rb
    - spec/features/*

RSpec/InstanceVariable:
  Exclude: []

RSpec/MessageSpies:
  Enabled: true

RSpec/MultipleMemoizedHelpers:
  Enabled: true
  Max: 13

RSpec/MultipleExpectations:
  Enabled: true
  Exclude:
    - spec/features/**/*_spec.rb

RSpec/NestedGroups:
  Enabled: true
  Max: 5

RSpec/NoExpectationExample:
  Exclude: []

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: never

Style/GuardClause:
  MinBodyLength: 2

Style/StringLiterals:
  EnforcedStyle: single_quotes

TradeTariff/ConfigOrder:
  Enabled: true
