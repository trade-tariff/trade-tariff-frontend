inherit_gem:
  rubocop-govuk:
    - config/default.yml
    - config/rails.yml

require:
  - ./.rubocop/cop/trade_tariff/config_order

plugins:
  - rubocop-rspec
  - rubocop-capybara

AllCops:
  Exclude:
    - "db/schema.rb"
    - "vendor/**/*"
    - "bin/**"
    - "db/**/*"
    - "node_modules/**/*"
    - "tmp/**/*"

Layout/LineLength:
  Max: 120

Metrics/AbcSize:
  Max: 20

RSpec/DescribeClass:
  Exclude:
    - tasks/**/*.rb
    - spec/features/*

RSpec/ExampleLength:
  Enabled: false

Rails/HelperInstanceVariable:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Max: 13

RSpec/MultipleExpectations:
  Exclude:
    - spec/features/**/*_spec.rb

RSpec/NestedGroups:
  Max: 5

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: never

Style/GuardClause:
  MinBodyLength: 2

Style/StringLiterals:
  EnforcedStyle: single_quotes

TradeTariff/ConfigOrder:
  Enabled: true
