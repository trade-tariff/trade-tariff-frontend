homepage:
  title: Parcels, gifts, belongings
  description: Check whether customs charges will apply when sending or receiving items.
steps:
  - id: parcel_charges
    path: i-have-been-asked-to-pay-a-charge-before-a-parcel-is-delivered
    route_name: parcel_gift_charges
    label: I’ve been asked to pay a charge on a parcel
    title: I’ve been asked to pay a charge on a parcel
    breadcrumb: A charge on a parcel
    services: [uk, xi]
    sections:
      - content: |
          Customs clearance is required on every item sent from another country. This checks:

          * if the item is banned or restricted
          * what, if any tax and duty needs to be paid

          This applies to new and used items whether sent as gifts or purchased:

          * online from a seller outside the UK
          * abroad and sent back to the UK

          You may have to pay if:

          * you bought the item and it cost more than £135
          * it’s a gift worth more than £39
          * it contains alcohol, tobacco or vaping products (Excise Duty is charged at any value)

          You may need to pay VAT, Customs Duty or Excise Duty before you get the item. The amount depends on what the item is, where it’s sent from and whether VAT has been accounted for by the seller.

          VAT is normally accounted for by the sender of the goods when sent as part of a sale.

          However, if the seller did not account for VAT or duty when they sent the item, the delivery company will likely undertake the customs clearance process and will ask you to pay it before they deliver. They may also add a handling fee.

          ## If you think you have been charged incorrectly
        links:
          - prefix: For Royal Mail or Parcelforce, you can
            text: report incorrect Customs Duty or VAT on items imported by post
            target: https://www.gov.uk/government/publications/report-incorrect-customs-duty-or-vat-on-items-imported-by-post-bor286
            new_tab: true
            button: false
          - prefix: If you’ve already paid a delivery company, you can
            text: claim a repayment of import duty and VAT
            target: https://www.gov.uk/guidance/how-to-claim-a-repayment-of-import-duty-and-vat-if-youve-overpaid
            new_tab: true
            button: false
  - id: incoming_tax
    path: i-want-to-know-what-i-might-pay-on-something-coming-from-abroad
    route_name: parcel_gift_incoming_tax
    label: I want to know what tax I might pay on a parcel sent to me
    title: I want to know what I might pay on a parcel sent to me
    breadcrumb: Tax on a parcel sent to you
    services: [uk, xi]
    sections:
      - content: |
          How much Customs Duty and VAT you pay depends on what the item is, where it’s sent from, and whether it’s a gift or something you bought.

          **If it’s a gift from a person**

          * £39 or less: no VAT or Customs Duty liability
          * more than £39 and up to £135: you may be liable to pay Import VAT
          * more than £135: you may be liable to pay Import VAT and Customs Duty

          **If it is something you bought**

          * £135 or less: VAT liability is usually included in the price by the seller, and Customs Duty is not usually charged
          * more than £135: Import VAT and Customs Duty will normally be collected by the delivery company

          **If your parcel contains alcohol, tobacco, or vaping products**

          You pay Excise Duty on alcohol, tobacco, pre-filled vapes and vaping liquid sent from outside the UK. This applies at any value, whether you bought the goods or received them as a gift.

          **Gifts of alcohol or tobacco**

          To count as a gift, the goods must be sent by a private individual outside the UK to a private individual in the UK, be sent on an occasional basis (for example, a birthday or Christmas), and must not have been paid for by anyone in the UK.

          A gift of alcohol or tobacco may qualify for relief from Customs Duty and import VAT if both of the following apply:

          * it is worth £39 or less
          * it is within the gift quantity limits

          You still pay Excise Duty on all gifts of alcohol or tobacco.

          If the gift is over the quantity limits, you would be liable for import VAT on the whole gift. Customs Duty relief only covers the amount within the limits.
        links:
          - prefix: Check the gift quantity limits in
            text: Duties and import VAT on gifts
            target: https://www.gov.uk/guidance/import-vat-and-customs-duty-on-gifts
            new_tab: true
            button: false
      - content: |
          **Goods you buy**

          If you buy alcohol, tobacco, pre-filled vapes or vaping liquid from outside the UK, the £135 Customs Duty threshold does not apply. You may need to pay Customs Duty, VAT and Excise Duty.

          If a delivery company clears your parcel through customs, they may charge you an additional handling fee.

          Different rules apply if the parcel is sent to Northern Ireland.
        links:
          - text: Find out more about duties and import VAT on Gifts sent from abroad
            target: https://www.gov.uk/guidance/import-vat-and-customs-duty-on-gifts
            new_tab: true
            button: false
          - prefix: For non-gift based imports,
            text: read more about tax and customs for goods sent from abroad
            target: https://www.gov.uk/goods-sent-from-abroad/tax-and-duty
            new_tab: true
            button: false
  - id: sending_overseas
    path: i-am-sending-a-parcel-or-gift-to-someone-abroad
    route_name: parcel_gift_sending_overseas
    label: I’m sending a parcel or gift overseas
    title: I’m sending a parcel or gift overseas
    breadcrumb: Sending a parcel or gift overseas
    services: [uk, xi]
    sections:
      - content: |
          When you send a parcel or gift overseas, you need to describe each item and give its commodity code on the customs declaration.

          Some postal and courier services can help you find the right code.
        details:
          summary: What a commodity code is used for
          content: |
            A commodity code describes the item you’re sending.

            Customs use it to check what tax, duty or rules apply when goods move between countries.

            The code must describe the item itself, not “gift” or “parcel”.

            If your parcel contains different types of item, you need a code for each type.
          links:
            - text: Read how to find a commodity code
              target: https://www.gov.uk/guidance/finding-commodity-codes-for-imports-or-exports
              new_tab: true
              button: false
              suffix: .
        links:
          - text: Search for a commodity code
            target: commodity_search
            new_tab: false
            button: true
      - content: |
          ## What the person receiving it might pay

          Some countries have duty reliefs for goods below certain values and/or gifts. Whether these apply will be governed by the customs administration of the destination country.
  - id: personal_baggage
    path: i-wish-to-bring-goods-back-from-overseas-in-personal-luggage
    route_name: parcel_gift_personal_baggage
    label: I’m bringing goods into the UK in my luggage
    title: I’m bringing goods into the UK in my luggage
    breadcrumb: Goods in personal baggage
    services: [uk, xi]
    sections:
      - content: |
          You can bring goods worth up to £390 into Great Britain without paying tax or duty, if they are for your own use or a gift. The limit is £270 if you arrive by private plane or private boat.

          This includes goods you buy abroad or in a duty-free or tax-free shop.

          If your goods are worth more than your allowance, you must declare all of them. You pay duty and VAT on their total value, not only the amount over the limit. The rate depends on the type of goods.

          Alcohol and tobacco have separate allowances.
        links:
          - text: Check the allowances for bringing goods into the UK
            suffix: ', including Northern Ireland.'
            target: https://www.gov.uk/bringing-goods-into-uk-personal-use
            new_tab: true
            button: false
  - id: moving_belongings
    path: i-am-moving-to-the-uk-and-bringing-my-belongings
    route_name: parcel_gift_moving_belongings
    label: I’m bringing personal belongings to the UK
    title: I’m bringing personal belongings to the UK
    breadcrumb: Bringing personal belongings to the UK
    services: [uk, xi]
    sections:
      - content: |
          If you’re bringing or sending personal belongings to the UK, different customs, tax and import rules may apply depending on what you’re bringing and why you’re bringing it.

          This could include:

          * personal possessions and luggage
          * household belongings and furniture
          * cars, motorcycles and other vehicles
          * pets

          Find out more about:
        links:
          - text: Bringing your belongings to the UK
            suffix: .
            target: https://www.gov.uk/moving-to-uk
            new_tab: true
            button: false
          - text: Bringing pets to Great Britain
            suffix: .
            target: https://www.gov.uk/bringing-pet-animals-to-great-britain
            new_tab: true
            button: false
      - content: |
          ## If you’re moving your residence to the UK

          If you’re moving your normal place of residence to the UK, you may be able to claim Transfer of Residence (ToR) relief.

          Transfer of Residence relief can allow eligible people to bring their personal belongings to the UK without paying Customs Duty or VAT.

          You should apply for Transfer of Residence relief before your belongings are imported into the UK.
        links:
          - text: Check if you can get Transfer of Residence relief
            suffix: .
            target: https://www.gov.uk/guidance/transfer-of-residence-to-great-britain
            new_tab: true
            button: false
          - text: Apply for Transfer of Residence relief
            suffix: .
            target: https://www.gov.uk/guidance/application-for-transfer-of-residence-relief-tor1
            new_tab: true
            button: false
