  description: Check charges, tax and duty when sending or receiving items.
steps:
  - id: parcel_charges
    path: i-have-been-asked-to-pay-a-charge-before-a-parcel-is-delivered
    route_name: parcel_gift_charges
    label: I have been asked to pay a charge before a parcel is delivered
    title: I have been asked to pay a charge before a parcel is delivered
    breadcrumb: A charge on a parcel
    services: [uk, xi]
    sections:
      - content: |
          All items sent or couriered from another country will go through customs to check:

          * for any banned or restricted items
          * what tax and duty should be paid.

          This includes new or used items purchased:

          * online and shipped from outside the UK
          * overseas and sent back to the UK.

          You might be charged if:

          * **the item costs more than £135**
          * **it is a gift worth more than £39**
          * it contains alcohol or tobacco (charged at any value)

          VAT, customs duty or excise duty might have to be paid before you receive the item. The amount of duty depends on the specific item and where it is being sent from.

          If VAT or duty was not paid when the item was sent, the delivery company collects it from you before delivery. They may also add their own handling fee.

          ## If you think you have been charged incorrectly
        links:
          - prefix: If you think you’ve been overcharged you can
            text: report incorrect Customs Duty or VAT on items imported by post
            target: https://www.gov.uk/government/publications/report-incorrect-customs-duty-or-vat-on-items-imported-by-post-bor286
            new_tab: true
            button: false
          - prefix: Find out more about
            text: how to claim a repayment of import duty and VAT if you’ve overpaid
            target: https://www.gov.uk/guidance/how-to-claim-a-repayment-of-import-duty-and-vat-if-youve-overpaid
            new_tab: true
            button: false
  - id: incoming_tax
    path: i-want-to-know-what-i-might-pay-on-something-coming-from-abroad
    route_name: parcel_gift_incoming_tax
    label: I want to know what I might pay on something coming from abroad
    title: I want to know what I might pay on something coming from abroad
    breadcrumb: Tax on a parcel sent to you
    services: [uk, xi]
    sections:
      - content: |
          Duty and VAT rates depend on what is being sent, where it is being sent from, and whether it is a gift or something you bought.

          **If it is a gift from a person:**

          * £39 or less: no VAT or Customs Duty
          * £39 to £135: Import VAT may be charged
          * more than £135: Import VAT and Customs Duty may be charged

          **If it is something you bought:**

          * £135 or less: VAT is usually included in the price by the seller, and Customs Duty is not usually charged
          * more than £135: Import VAT and Customs Duty may be charged by the delivery company

          **If it contains alcohol or tobacco:**

          * £135 or less: VAT is usually included in the price by the seller, and Customs Duty is not usually charged
          * more than £135: Import VAT and Customs Duty may be charged by the delivery company

          The delivery company may also add its own handling fee.

          Different rules apply to parcels sent to Northern Ireland.
        links:
          - prefix: Find out more about
            text: tax and customs for goods sent from abroad
            target: https://www.gov.uk/goods-sent-from-abroad/tax-and-duty
            new_tab: true
            button: false
  - id: sending_overseas
    path: i-am-sending-a-parcel-or-gift-to-someone-abroad
    route_name: parcel_gift_sending_overseas
    label: I am sending a parcel or gift to someone abroad
    title: I am sending a parcel or gift to someone abroad
    breadcrumb: Sending a parcel or gift overseas
    services: [uk, xi]
    sections:
      - content: |
          If you’re sending or receiving a gift, the item must be described and the correct commodity code provided on customs declarations.

          Some postal and parcel services will help you identify the appropriate code.
        details:
          summary: What a commodity code is used for
          content: |
            A commodity code describes the item you are sending.

            Customs use it to check what tax, duty or rules apply when goods move between countries.

            Your postal or courier service may ask you for a commodity code when you send a parcel or gift overseas.

            The code should describe the item itself, not “gift” or “parcel”.

            If your parcel contains different types of items, you may need more than one code.
        links:
          - text: Search for a commodity code
            target: commodity_search
            new_tab: false
            button: true
      - content: |
          ## What the person receiving the parcel or gift might pay

          The person receiving the gift might have to pay import duties and taxes. The amount depends on the item being sent, where it is going and where it is coming from.

          * for a birthday, anniversary or other occasion
          * bought and sent between individuals, not companies
          * intended for personal use
  - id: moving_belongings
    path: i-am-moving-to-the-uk-and-bringing-my-belongings
    route_name: parcel_gift_moving_belongings
    label: I am moving to the UK and bringing my belongings
    title: I am moving to the UK and bringing my belongings
    breadcrumb: Moving to the UK with personal belongings
    services: [uk, xi]
    sections:
      - content: |
          If you’re moving to the UK permanently or temporarily and bringing personal belongings with you, different rules apply.
        links:
          - prefix: Find out more about
            text: moving personal belongings to the UK
            target: https://www.gov.uk/moving-to-uk
            new_tab: true
            button: false
      - content: |
          ## Transfer of Residence relief

          You can get relief from customs charges on personal belongings and other goods when transferring your place of residence to Great Britain or Northern Ireland.
        links:
          - prefix: Find out more about
            text: Transfer of residence to the UK
            target: https://www.gov.uk/guidance/transfer-of-residence-to-great-britain
            new_tab: true
            button: false
          - prefix: Complete
            text: application for transfer of residence relief
            target: https://www.gov.uk/guidance/application-for-transfer-of-residence-relief-tor1
            new_tab: true
            button: false
  - id: personal_baggage
    path: i-wish-to-bring-goods-back-from-overseas-in-personal-luggage
    route_name: parcel_gift_personal_baggage
    label: I wish to bring goods back from overseas in personal luggage
    title: I wish to bring goods back from overseas in personal luggage
    breadcrumb: Goods in personal baggage
    services: [uk, xi]
    sections:
      - content: |
          You are entitled to a tax-free personal allowance of £390 for goods brought back to the UK for personal use, or as a gift.

          This includes goods purchased in another country or in a duty-free or tax-free shop.
        links:
          - prefix: Find out more about
            text: bringing goods into the UK for personal use
            target: https://www.gov.uk/bringing-goods-into-uk-personal-use
            new_tab: true
            button: false
