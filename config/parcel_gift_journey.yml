steps:
  - id: parcel_charges
    path: i-have-been-asked-to-pay-a-charge-before-a-parcel-is-delivered
    route_name: parcel_gift_charges
    label: I’ve been asked to pay a charge on a parcel
    title: I’ve been asked to pay a charge on a parcel
    breadcrumb: A charge on a parcel
    services: [uk, xi]
    sections:
      - content: |
          Customs check every item sent to you from another country. They check:

          * if the item is banned or restricted
          * what tax and duty you need to pay

          This applies to new and used items you bought:

          * online from a seller outside the UK
          * abroad and sent back to the UK

          You may have to pay if:

          * you bought the item and it cost more than £135
          * it’s a gift worth more than £39
          * it contains alcohol, tobacco or vaping products (Excise Duty is charged at any value)

          You may need to pay VAT, Customs Duty or Excise Duty before you get the item. The amount depends on what the item is and where it’s sent from.

          If the seller did not charge VAT or duty when they sent the item, the delivery company will ask you to pay it before they deliver. They may also add a handling fee.

          ## If you think the charge is wrong
        links:
          - prefix: For Royal Mail or Parcelforce, you can
            text: report incorrect Customs Duty or VAT on items imported by post
            target: https://www.gov.uk/government/publications/report-incorrect-customs-duty-or-vat-on-items-imported-by-post-bor286
            new_tab: true
            button: false
          - prefix: If you’ve already paid another courier or freight company, you can
            text: claim a repayment of import duty and VAT
            target: https://www.gov.uk/guidance/how-to-claim-a-repayment-of-import-duty-and-vat-if-youve-overpaid
            new_tab: true
            button: false
  - id: incoming_tax
    path: i-want-to-know-what-i-might-pay-on-something-coming-from-abroad
    route_name: parcel_gift_incoming_tax
    label: I want to know what tax I might pay on a parcel sent to me
    title: I want to know what I might pay on a parcel sent to me
    breadcrumb: Tax on a parcel sent to you
    services: [uk, xi]
    sections:
      - content: |
          How much Customs Duty and VAT you pay depends on what the item is, where it’s sent from, and whether it’s a gift or something you bought.

          **If it’s a gift from a person**

          * £39 or less: no VAT or Customs Duty
          * more than £39 and up to £135: you may pay Import VAT
          * more than £135: you may pay Import VAT and Customs Duty

          **If it is something you bought:**

          * £135 or less: VAT is usually included in the price by the seller, and Customs Duty is not usually charged
          * more than £135: Import VAT and Customs Duty may be charged by the delivery company

          **If it contains alcohol, tobacco or vaping products**

          You’ll pay Excise Duty, Customs Duty and VAT at any value, whether it’s a gift or something you bought.

          The delivery company may also add its own handling fee.

          Different rules apply to parcels sent to Northern Ireland.
        links:
          - prefix: Read more about
            text: tax and customs for goods sent from abroad
            target: https://www.gov.uk/goods-sent-from-abroad/tax-and-duty
            new_tab: true
            button: false
  - id: sending_overseas
    path: i-am-sending-a-parcel-or-gift-to-someone-abroad
    route_name: parcel_gift_sending_overseas
    label: I’m sending a parcel or gift overseas
    title: I’m sending a parcel or gift overseas
    breadcrumb: Sending a parcel or gift overseas
    services: [uk, xi]
    sections:
      - content: |
          When you send a parcel or gift overseas, you need to describe each item and give its commodity code on the customs declaration.

          Some postal and courier services can help you find the right code.
        details:
          summary: What a commodity code is used for
          content: |
            A commodity code describes the item you’re sending.

            Customs use it to check what tax, duty or rules apply when goods move between countries.

            The code must describe the item itself, not the parcel or the reason for sending it (for example, a gift).

            If your parcel contains different types of item, each type may need its own commodity code.
          links:
            - text: Read how to find a commodity code
              target: https://www.gov.uk/guidance/finding-commodity-codes-for-imports-or-exports
              new_tab: true
              button: false
              suffix: .
        links:
          - text: Search for a commodity code
            target: commodity_search
            new_tab: false
            button: true
      - content: |
          ## What the person receiving it might pay

          The country you send to sets its own rules and charges for import duties and taxes. The person receiving the parcel may be required to pay them.
  - id: personal_baggage
    path: i-wish-to-bring-goods-back-from-overseas-in-personal-luggage
    route_name: parcel_gift_personal_baggage
    label: I’m bringing goods into the UK in my luggage
    title: I’m bringing goods into the UK in my luggage
    breadcrumb: Goods in personal baggage
    services: [uk, xi]
    sections:
      - content: |
          You can bring up to £390 of goods into Great Britain without paying tax or duty, if they are for your own use or a gift. The limit is £270 if you arrive by private plane or boat.

          This includes goods you bought abroad or in a duty-free or tax-free shop.

          Alcohol and tobacco have separate allowances.
        links:
          - text: Check the allowances for bringing goods into the UK
            suffix: ', including Northern Ireland.'
            target: https://www.gov.uk/bringing-goods-into-uk-personal-use
            new_tab: true
            button: false
  - id: moving_belongings
    path: i-am-moving-to-the-uk-and-bringing-my-belongings
    route_name: parcel_gift_moving_belongings
    label: I’m moving to the UK with my belongings
    title: I’m moving to the UK with my personal belongings
    breadcrumb: Moving to the UK with personal belongings
    services: [uk, xi]
    sections:
      - content: |
          If you’re moving to the UK and bringing your belongings with you, separate rules apply. These depend on whether you’re moving permanently or for a set time.
        links:
          - text: Read about moving your belongings to the UK
            suffix: .
            target: https://www.gov.uk/moving-to-uk
            new_tab: true
            button: false
      - content: |
          ## Transfer of Residence relief

          You may not have to pay customs charges on your belongings if you’re moving your home to Great Britain or Northern Ireland. This is called Transfer of Residence relief.
        links:
          - text: Check if you can get Transfer of Residence relief
            suffix: .
            target: https://www.gov.uk/guidance/transfer-of-residence-to-great-britain
            new_tab: true
            button: false
          - text: Apply for Transfer of Residence relief
            suffix: .
            target: https://www.gov.uk/guidance/application-for-transfer-of-residence-relief-tor1
            new_tab: true
            button: false
