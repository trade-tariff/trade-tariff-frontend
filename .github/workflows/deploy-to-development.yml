name: Deploy to development

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Git SHA or ref to deploy (defaults to current HEAD)'
        type: string
        required: false
  pull_request_target:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read

jobs:
  authorize:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'needs-deployment') &&
       (github.event.action != 'labeled' || github.event.label.name == 'needs-deployment'))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
    steps:
      - uses: trade-tariff/trade-tariff-tools/.github/actions/authorize-development-deployment@main
        id: authorize

  deploy:
    needs: authorize
    # Rejected requests must not cancel an authorized development deployment.
    concurrency:
      group: deploy-development
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    uses: trade-tariff/trade-tariff-tools/.github/workflows/deploy-ecs.yml@main
    with:
      app-name: tariff-frontend
      environment: development
      test-flavour: none
      checkout-ref: ${{ needs.authorize.outputs.sha }}
    secrets:
      basic-password: ${{ secrets.BASIC_PASSWORD }}
      slack-webhook: ${{ secrets.SLACK_WEBHOOK }}
      ssh-key: ${{ secrets.PRIVATE_SSH_KEY }}

  start-services:
    needs: authorize
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: trade-tariff/trade-tariff-tools/.github/actions/start-services@main
        with:
          service-names: frontend
          environment: development
